<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustGuard Widget Embed Demonstration</title>
  <!-- Load the widget CSS stylesheet -->
  <link rel="stylesheet" href="./dist/trustguard-widget.css">
  <style>
    body {
      background-color: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .navbar {
      background-color: #0f172a;
      border-b: 1px solid #1e293b;
      padding: 20px;
      text-align: center;
    }
    .hero {
      max-width: 800px;
      margin: 60px auto 40px auto;
      text-align: center;
      padding: 0 20px;
    }
    .hero h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .widget-wrap {
      max-width: 1200px;
      margin: 0 auto 100px auto;
      padding: 0 20px;
    }
    .tag {
      background-color: #1e1b4b;
      color: #818cf8;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 12px;
      border-radius: 9999px;
      display: inline-block;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <strong style="color: #818cf8;">🏢 ClientWebsiteCorp.com</strong>
  </div>

  <div class="hero">
    <span class="tag">Embedded Integration Demo</span>
    <h1>Customer Testimonials</h1>
    <p>
      This static page demonstrates how third-party client websites can embed the review widget. 
      The content below is loaded completely standalone from our TrustGuard review API.
    </p>
  </div>

  <div class="widget-wrap">
    <!-- Standalone Widget Target Element -->
    <div id="trustguard-widget" data-backend-url="http://localhost:5000"></div>
  </div>

  <!-- Load the widget bundle script -->
  <script src="./dist/trustguard-widget.js"></script>

</body>
</html>
